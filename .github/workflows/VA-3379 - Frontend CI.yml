name: VA-3379 Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend contract tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Scan source and build output for credential literals
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'VITE_API_KEY=[^[:space:]#]+|pit-[0-9a-f-]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}' \
            --exclude-dir=.git --exclude-dir=node_modules .; then
            echo 'Credential-like literal detected in the frontend tree or build output.'
            exit 1
          fi
